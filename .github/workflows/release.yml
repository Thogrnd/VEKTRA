# Bygger VEKTRA for Windows og legger installasjonsfila ut som en GitHub-release.
# Starter av seg selv når package.json endres på main (nytt versjonsnummer),
# når det lages en tag som begynner med v, eller med «Run workflow» under Actions.
# Finnes utgivelsen for versjonen fra før, hopper byggingen over publiseringen.
name: Bygg og publiser VEKTRA

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
