# Bygger VEKTRA for Windows og legger installasjonsfila ut som en GitHub-release.
# Starter når du lager en tag som begynner med v, for eksempel v1.0.1.
name: Bygg og publiser VEKTRA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
